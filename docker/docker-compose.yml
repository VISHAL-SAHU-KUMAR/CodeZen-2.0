version: '3.8'

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
      - ai-service
    environment:
      - MONGO_URI=mongodb://mongo:27017/agripredict360
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000/api
      - PORT=5000

  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/Dockerfile.ai
    ports:
      - "8000:8000"
    volumes:
      - ../ai-service/models:/app/models

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
